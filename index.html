<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LynxMetrics CDN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 1px solid #e2e8f0;
            padding: 3rem 2.5rem;
            border-radius: 12px;
            background-color: #ffffff;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        }
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .logo-icon {
            width: 72px;
            height: 72px;
        }
        h1 {
            font-size: 1.625rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: #0f172a;
            letter-spacing: -0.025em;
        }
        p {
            font-size: 0.9375rem;
            color: #64748b;
            margin: 0 0 2rem 0;
            line-height: 1.5;
        }
        .link-container {
            margin-top: 1rem;
        }
        .site-link {
            font-size: 0.9375rem;
            font-weight: 600;
            color: #4f46e5;
            text-decoration: none;
            border-bottom: 1.5px solid transparent;
        }
        .site-link:hover {
            border-bottom-color: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="logo.png" class="logo-icon" alt="LynxMetrics Logo">
        </div>
        <h1>LynxMetrics CDN</h1>
        <p>High-performance static distribution network for tracking assets.</p>
        <div class="link-container">
            <a href="https://lynxmetrics.com/" class="site-link">https://lynxmetrics.com/</a>
        </div>
    </div>
</body>
</html>
